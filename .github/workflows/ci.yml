"""Gatecheck Bot — CI: ruff + pytest (D8, M4).

Деплой-джоба (автодеплой по SSH) будет добавлена после настройки GitHub Secrets
(VPS_HOST, VPS_USER, VPS_SSH_KEY) — см. deploy/README.md.
"""

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q
